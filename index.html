/* tata letak */
.app{position:relative;z-index:1;height:100%;display:flex;gap:14px;padding:14px}
.side{width:290px;flex:none;display:flex;flex-direction:column;gap:14px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--line);border-radius:26px;padding:16px;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;align-items:center;gap:11px;font:800 20px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#e0813f);display:grid;place-items:center;color:#2a1405;box-shadow:0 6px 22px rgba(244,185,94,.4)}
.btn-new{display:flex;align-items:center;gap:9px;justify-content:center;padding:11px;border-radius:14px;font-weight:600;background:var(--glass2);border:1px solid var(--line);transition:.25s}
.btn-new:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.sec{font-size:12.5px;color:var(--ink2);margin:2px 4px -4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px;border-radius:14px;text-align:left;font-size:13px;font-weight:500;border:1px solid transparent;background:var(--glass2);transition:.25s}
.mode:hover{border-color:var(--line)}
.mode.on{background:linear-gradient(135deg,rgba(244,185,94,.3),rgba(110,193,232,.22));border-color:rgba(244,185,94,.6)}
.hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:60px;scrollbar-width:thin}
.h{display:flex;align-items:center;gap:6px;border-radius:12px;padding:3px 4px 3px 10px;transition:.2s}
.h:hover,.h.on{background:var(--glass2)}
.h .t{flex:1;text-align:left;padding:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.h .x{opacity:0;padding:6px;border-radius:8px;color:var(--ink2)}.h:hover .x,.h .x:focus-visible{opacity:1}.h .x:hover{color:#ff9b8a}
.foot{font-size:12px;color:var(--ink2);line-height:1.4}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:none;align-items:center;gap:10px;padding:2px 2px 10px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.scroll{flex:1;overflow:auto;padding:6px 4px 14px;scrollbar-width:thin;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto}
/* sambutan */
.hero{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:4vh 0}
.hero h1{font:800 clamp(40px,8vw,84px)/.95 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin:0 0 14px;text-shadow:0 4px 40px rgba(0,0,0,.45);background:linear-gradient(100deg,#fff 30%,var(--gold) 55%,var(--sky) 85%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s ease-in-out infinite alternate,rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero p{font-size:clamp(16px,2.4vw,20px);color:var(--ink);max-width:34ch;margin:0 0 26px;text-shadow:0 2px 16px rgba(0,0,0,.5);animation:rise .9s .12s cubic-bezier(.2,.8,.2,1) both}
.chips{display:flex;flex-wrap:wrap;gap:9px;animation:rise .9s .25s cubic-bezier(.2,.8,.2,1) both}
.chip{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-size:14px;transition:.25s}
.chip:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 26px rgba(0,0,0,.3)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes shine{to{background-position:100% 0}}
/* pesan */
.msg{display:flex;gap:11px;margin:16px 0;animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
.msg.u{flex-direction:row-reverse}
.av{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#e0813f);color:#2a1405}
.msg.u .av{background:linear-gradient(135deg,var(--sky),#3b82b8);color:#04202e}
.bub{max-width:min(640px,86%);padding:12px 16px;border-radius:18px 18px 18px 6px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.u .bub{border-radius:18px 18px 6px 18px;background:rgba(110,193,232,.24);border-color:rgba(110,193,232,.4)}
.bub p{margin:0 0 .6em}.bub p:last-child{margin:0}
.bub h4{margin:.6em 0 .3em;font:700 16px "Bricolage Grotesque",sans-serif;color:var(--gold)}
.bub ul,.bub ol{margin:.3em 0 .7em;padding-left:1.3em}
.bub code{font:13px ui-monospace,Menlo,monospace;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px}
.bub pre{margin:.6em 0;padding:12px 14px;background:rgba(0,0,0,.45);border-radius:12px;overflow-x:auto}.bub pre code{background:none;padding:0}
.acts{display:flex;gap:4px;margin-top:8px}
.act{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2);padding:4px 8px;border-radius:8px}.act:hover{background:var(--glass2);color:var(--ink)}
.act .i{width:16px;height:16px}
.dots{display:inline-flex;gap:5px;padding:6px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bn 1.1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
/* penulis */
.comp{max-width:780px;width:100%;margin:0 auto;position:relative;border-radius:24px;padding:2px;background:linear-gradient(120deg,rgba(255,255,255,.2),rgba(255,255,255,.08));transition:.3s}
.comp:focus-within{background:linear-gradient(120deg,var(--gold),var(--sky),var(--moss),var(--gold));background-size:300% 100%;animation:flow 4s linear infinite;box-shadow:0 14px 50px rgba(244,185,94,.18)}
@keyframes flow{to{background-position:300% 0}}
.cbox{display:flex;align-items:flex-end;gap:6px;padding:8px 8px 8px 16px;border-radius:22px;background:rgba(7,22,25,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
textarea{flex:1;resize:none;border:0;background:none;color:var(--ink);font:inherit;max-height:160px;padding:9px 0;outline:none}
textarea::placeholder{color:#9db3ad}
.send{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#e0813f);color:#2a1405;transition:.25s;position:relative}
.send:hover{transform:scale(1.07) rotate(-6deg)}.send:disabled{opacity:.4;transform:none}
.send.busy::after{content:"";position:absolute;inset:-4px;border-radius:17px;border:2px solid var(--gold);animation:ring 1.2s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.mic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink2)}.mic:hover{background:var(--glass2);color:var(--ink)}.mic.on{color:#ff8f7d;animation:pulse 1s infinite}
.note{text-align:center;font-size:12px;color:var(--ink2);margin:8px 0 2px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#0b1f21;padding:8px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
@media (max-width:820px){
 .app{padding:10px;gap:0}
 .side{position:fixed;z-index:10;top:calc(10px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;width:min(310px,86vw);transform:translateX(-120%)}
 body.open .side{transform:none}
 body.open .scrim{display:block;position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5)}
 .top{display:flex}.bub{max-width:90%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="photo" id="photo"></div><div class="sun"></div><div class="mist m1"></div><div class="mist m2"></div><div class="shade"></div></div>

<div class="app">
 <aside class="side" id="side">
  <div class="brand"><span class="logo"><svg class="i"><use href="#logo"/></svg></span>Nusantara AI</div>
  <button class="btn-new" id="newChat"><svg class="i"><use href="#plus"/></svg>Percakapan baru</button>
  <div class="sec">Pilih peran</div>
  <div class="modes" id="modes"></div>
  <div class="sec">Riwayat</div>
  <div class="hist" id="hist"></div>
  <div class="foot">Riwayat tersimpan di perangkat ini. AI bisa keliru, periksa kembali info penting.</div>
 </aside>
 <div class="scrim" id="scrim"></div>
 <main class="main">
  <div class="top"><button class="ib" id="burger" aria-label="Buka menu"><svg class="i"><use href="#menu"/></svg></button><div class="brand" style="font-size:18px">Nusantara AI</div></div>
  <div class="scroll" id="scroll"><div class="wrap" id="wrap"></div></div>
  <div class="comp"><div class="cbox">
   <textarea id="inp" rows="1" placeholder="Tanyakan apa saja kepada Nusantara AI" aria-label="Pesan"></textarea>
   <button class="mic" id="mic" aria-label="Input suara"><svg class="i"><use href="#mic"/></svg></button>
   <button class="send" id="send" aria-label="Kirim"><svg class="i" id="sendIc"><use href="#send"/></svg></button>
  </div></div>
  <div class="note">Enter untuk kirim, Shift+Enter untuk baris baru</div>
 </main>
</div>
<div class="toast" id="toast"></div>

<script>
const MODES=[
{id:"umum",n:"Umum",ic:"spark",sys:"Kamu Nusantara AI, asisten ramah yang paham budaya Indonesia. Jawab jelas, ringkas, dan berguna.",chips:[["globe","Jelaskan asal-usul batik dengan singkat"],["spark","Beri 5 ide kegiatan akhir pekan yang murah"],["pen","Bantu saya menyusun jadwal belajar seminggu"]]},
{id:"belajar",n:"Belajar",ic:"book",sys:"Kamu guru sabar. Jelaskan konsep langkah demi langkah dengan contoh dari kehidupan sehari-hari di Indonesia, lalu beri 1 soal latihan kecil.",chips:[["book","Jelaskan fotosintesis untuk anak SMP"],["book","Cara mudah memahami persentase"],["spark","Buat kuis 5 soal sejarah kemerdekaan"]]},
{id:"kode",n:"Koding",ic:"code",sys:"Kamu insinyur perangkat lunak senior. Beri kode yang rapi dalam blok kode dan jelaskan secara singkat. Gunakan komentar berbahasa Indonesia.",chips:[["code","Buat fungsi JavaScript untuk format rupiah"],["code","Jelaskan beda let, const, dan var"],["code","Bantu rancang tabel database toko online"]]},
{id:"tulis",n:"Menulis",ic:"pen",sys:"Kamu penulis dan penyunting profesional berbahasa Indonesia yang baik dan benar. Bantu menulis, merapikan, dan meringkas dengan gaya yang sesuai permintaan.",chips:[["pen","Tulis caption Instagram tentang pagi di gunung"],["pen","Rapikan email lamaran kerja saya"],["pen","Buat pantun tentang kopi"]]},
{id:"jelajah",n:"Kuliner & Wisata",ic:"map",sys:"Kamu pemandu wisata dan pakar kuliner Nusantara. Beri rekomendasi, tips perjalanan, perkiraan biaya kasar, dan etika setempat. Ingatkan untuk memeriksa info terbaru seperti jam buka dan harga.",chips:[["map","Rencana 3 hari di sekitar Gunung Bromo"],["food","Makanan khas yang wajib dicoba di Sumatera Barat"],["food","Resep soto ayam rumahan yang mudah"]]},
{id:"bahasa",n:"Bahasa Daerah",ic:"globe",sys:"Kamu ahli bahasa-bahasa daerah Indonesia (Jawa, Sunda, Minang, Bali, Bugis, Batak, dan lainnya). Terjemahkan, jelaskan tingkat tutur, beri contoh kalimat, dan sebutkan bila kamu kurang yakin.",chips:[["globe","Terjemahkan selamat pagi ke 5 bahasa daerah"],["globe","Jelaskan tingkat tutur bahasa Jawa"],["pen","Ajari saya salam dalam bahasa Sunda"]]}];
const $=id=>document.getElementById(id);
const ico=n=>`<svg class="i"><use href="#${n}"/></svg>`;
let chats=[],cur=null,mode="umum",busy=false,ctrl=null;
try{chats=JSON.parse(localStorage.getItem("nus_chats")||"[]")}catch(e){chats=[]}
const save=()=>{try{localStorage.setItem("nus_chats",JSON.stringify(chats.slice(0,40)))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inl(s){return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>")}
function md(s){const b=[];s=esc(s).replace(/```\w*\n?([\s\S]*?)(```|$)/g,(m,c)=>{b.push(c.replace(/\n$/,""));return "\u0000"+(b.length-1)+"\u0000"});
 let o=[],l=null,m;const cl=()=>{if(l){o.push("</"+l+">");l=null}};
 for(const ln of s.split("\n")){
  if(m=ln.match(/^\s*[-*•]\s+(.*)/)){if(l!="ul"){cl();o.push("<ul>");l="ul"}o.push("<li>"+inl(m[1])+"</li>")}
  else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(l!="ol"){cl();o.push("<ol>");l="ol"}o.push("<li>"+inl(m[1])+"</li>")}
  else{cl();if(m=ln.match(/^#{1,4}\s+(.*)/))o.push("<h4>"+inl(m[1])+"</h4>");else if(ln.trim())o.push("<p>"+inl(ln)+"</p>")}}
 cl();return o.join("").replace(/<p>\u0000(\d+)\u0000<\/p>|\u0000(\d+)\u0000/g,(x,a,c)=>"<pre><code>"+b[a??c]+"</code></pre>")}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1600)}
function renderModes(){$("modes").innerHTML=MODES.map(m=>`<button class="mode ${m.id==mode?"on":""}" data-m="${m.id}">${ico(m.ic)}${m.n}</button>`).join("")}
function renderHist(){$("hist").innerHTML=chats.map(c=>`<div class="h ${c===cur?"on":""}"><button class="t" data-o="${c.id}">${esc(c.title)}</button><button class="x" data-d="${c.id}" aria-label="Hapus">${ico("trash")}</button></div>`).join("")||'<div class="foot" style="padding:6px 8px">Belum ada percakapan.</div>'}
function bubble(m,i,last){const u=m.r=="u";return `<div class="msg ${u?"u":""}"><div class="av">${ico(u?"user":"logo")}</div><div><div class="bub" ${last?'id="live"':""}>${m.t?md(m.t):'<span class="dots"><i></i><i></i><i></i></span>'}</div>${!u&&m.t&&!busy?`<div class="acts"><button class="act" data-c="${i}">${ico("copy")}Salin</button>${last?`<button class="act" data-r="1">${ico("redo")}Ulangi</button>`:""}</div>`:""}</div></div>`}
function renderChat(keep){const w=$("wrap"),M=MODES.find(x=>x.id==mode);
 if(!cur||!cur.msgs.length){w.innerHTML=`<div class="hero"><h1>Nusantara AI</h1><p>Teman bicara dari Sabang sampai Merauke. Tanyakan apa pun.</p><div class="chips">${M.chips.map(c=>`<button class="chip" data-q="${esc(c[1])}">${ico(c[0])}${esc(c[1])}</button>`).join("")}</div></div>`;return}
 w.innerHTML=cur.msgs.map((m,i)=>bubble(m,i,i==cur.msgs.length-1)).join("");
 if(!keep)$("scroll").scrollTop=1e9}
function setBusy(b){busy=b;$("send").classList.toggle("busy",b);$("sendIc").innerHTML=`<use href="#${b?"stop":"send"}"/>`}
async function ask(){
 const last=cur.msgs[cur.msgs.length-1];
 const hist=cur.msgs.slice(0,-1).slice(-14).map(m=>({role:m.r=="u"?"user":"assistant",content:m.t}));
 ctrl=new AbortController();let raf=0;
 const paint=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const e=$("live");if(e){e.innerHTML=md(last.t);const sc=$("scroll");if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<160)sc.scrollTop=1e9}})};
 try{
  const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:cur.mode||mode,messages:hist}),signal:ctrl.signal});
  if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.error||"Server bermasalah ("+res.status+")")}
  const rd=res.body.getReader(),dec=new TextDecoder();let acc="";
  for(;;){const {done,value}=await rd.read();if(done)break;acc+=dec.decode(value,{stream:true});last.t=acc;paint()}
  last.t=acc||"Tidak ada jawaban. Coba ulangi."}
 catch(e){last.t=e&&e.name=="AbortError"?(last.t||"Dihentikan."):(last.t||(e&&e.message)||"Terjadi kendala. Coba kirim ulang.")}
}
async function send(text){
 text=(text||"").trim();if(!text||busy)return;
 if(!cur){cur={id:Date.now()+"",title:text.slice(0,38),mode,msgs:[]};chats.unshift(cur)}
 cur.msgs.push({r:"u",t:text},{r:"a",t:""});$("inp").value="";grow();setBusy(true);renderChat();renderHist();
 await ask();setBusy(false);save();renderChat(true);renderHist()}
function grow(){const t=$("inp");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,160)+"px"}
$("inp").addEventListener("input",grow);
$("inp").addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($("inp").value)}});
$("send").onclick=()=>busy?ctrl&&ctrl.abort():send($("inp").value);
$("newChat").onclick=()=>{if(busy)return;cur=null;renderChat();renderHist();document.body.classList.remove("open");$("inp").focus()};
$("burger").onclick=()=>document.body.classList.add("open");
$("scrim").onclick=()=>document.body.classList.remove("open");
$("modes").onclick=e=>{const b=e.target.closest("[data-m]");if(!b||busy)return;mode=b.dataset.m;if(cur&&!cur.msgs.length)cur=null;if(cur)cur.mode=mode;renderModes();renderChat(true);toast("Peran: "+MODES.find(x=>x.id==mode).n)};
$("hist").onclick=e=>{if(busy)return;const o=e.target.closest("[data-o]"),d=e.target.closest("[data-d]");
 if(o){cur=chats.find(c=>c.id==o.dataset.o);mode=cur.mode||"umum";renderModes();renderChat();renderHist();document.body.classList.remove("open")}
 if(d){const c=chats.find(c=>c.id==d.dataset.d);chats=chats.filter(x=>x!==c);if(cur===c)cur=null;save();renderChat();renderHist()}};
$("wrap").onclick=e=>{const q=e.target.closest("[data-q]"),c=e.target.closest("[data-c]"),r=e.target.closest("[data-r]");
 if(q)send(q.dataset.q);
 if(c){navigator.clipboard.writeText(cur.msgs[c.dataset.c].t).then(()=>toast("Tersalin"),()=>toast("Gagal menyalin"))}
 if(r&&!busy){const u=cur.msgs[cur.msgs.length-2].t;cur.msgs.splice(-2);send(u)}};
/* suara */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
if(!SR)$("mic").style.display="none";
$("mic").onclick=()=>{if(rec){rec.stop();return}
 try{rec=new SR();rec.lang="id-ID";rec.interimResults=true;$("mic").classList.add("on");
 rec.onresult=e=>{$("inp").value=[...e.results].map(r=>r[0].transcript).join("");grow()};
 rec.onerror=()=>toast("Mikrofon tidak tersedia");rec.onend=()=>{rec=null;$("mic").classList.remove("on")};rec.start()}catch(e){rec=null;toast("Mikrofon tidak tersedia")}};
/* paralaks latar */
const ph=$("photo");addEventListener("pointermove",e=>{ph.style.translate=((e.clientX/innerWidth-.5)*-18)+"px "+((e.clientY/innerHeight-.5)*-14)+"px"});
renderModes();renderHist();renderChat();
</script>
</body>
</html>
